<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Пельмень Судьбы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 3D-сцена на весь экран; сверху полоса опыта, портрет героя со здоровьем, таймер и оружие; реплики под ними, чтобы пальцы их не закрывали; справа снизу рывок и ульта; выбор улучшений карточками по центру */
:root{
  color-scheme:dark;
  --bg:#090b0f; --panel:#11141b; --panel2:#171b24; --line:#2a3141; --line2:#3a4357;
  --fg:#e9edf3; --mute:#8d96a6;
  --acc:#ff9d2e; --hot:#ff4d5e; --xp:#4fd1ff; --ok:#5fd16a; --gold:#ffc93c;
  --display:"Oswald","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Golos Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);margin:0;overflow:hidden}
#wrap{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;background:#000}
#wrap>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{touch-action:none}
#fd{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
img.ic{display:block;flex:none;object-fit:contain}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0 0 auto 0;display:flex;flex-direction:column;gap:8px;pointer-events:none;background:linear-gradient(180deg,#06080bb0,#06080b00)}
#xpb{height:5px;background:#000a;position:relative;overflow:hidden}
#xpb i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#1c8fd6,var(--xp))}
#h1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-inline:16px}
#hl{display:flex;align-items:center;gap:12px;min-width:0}
#hpo{position:relative;flex:none;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#2c3446,#0c0f14 75%);border:2px solid var(--line2);box-shadow:0 2px 10px #000a}
#hpo.sh{border-color:var(--gold);box-shadow:0 0 14px #ffc93c99}
#hpo img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}
#lv{position:absolute;right:-7px;bottom:-4px;min-width:22px;height:18px;padding:0 5px;border-radius:9px;background:var(--xp);color:#04121a;font:700 11px/18px var(--mono);text-align:center;box-shadow:0 1px 4px #000a}
#hpw{display:flex;flex-direction:column;gap:4px;min-width:0;width:min(220px,36vw)}
.bar{height:15px;background:#000b;border:1px solid #ffffff2e;border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(#ff7584,#d92c40)}
#th{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 10px var(--mono);color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;font-variant-numeric:tabular-nums}
#hz{font:500 10px/1.2 var(--mono);letter-spacing:.03em;color:#b4bccb;text-shadow:0 1px 3px #000}
#hc{display:flex;flex-direction:column;align-items:center;gap:2px}
#ho{font:600 26px/1 var(--display);letter-spacing:.06em;color:var(--fg);text-shadow:0 2px 8px #000,0 0 2px #000;font-variant-numeric:tabular-nums;white-space:nowrap}
#ho.boss{color:var(--hot)}
#ho.txt{font-size:16px;letter-spacing:.14em}
#hs{font:500 9px var(--mono);letter-spacing:.22em;color:#b4bccb;text-transform:uppercase;text-shadow:0 1px 3px #000}
#hr{display:flex;justify-content:flex-end}
#pz{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:#090b0fc8;border:1px solid #ffffff30;cursor:pointer;display:flex;gap:5px;align-items:center;justify-content:center;padding:0}
#pz i{width:4px;height:13px;background:var(--fg);border-radius:1px}
#pz:hover{border-color:var(--acc)}
#h2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-inline:16px}
#hw{display:flex;gap:6px;flex-wrap:wrap}
.slot{position:relative;width:40px;height:40px;background:#090b0fd0;border:1px solid color-mix(in srgb,var(--rc,#fff) 45%,#ffffff24);border-bottom:3px solid var(--rc,#ffffff24);border-radius:5px;display:flex;align-items:center;justify-content:center}
.slot b{position:absolute;right:3px;bottom:0;font:700 10px var(--mono);color:#fff;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000}
.slot s{position:absolute;left:-4px;top:-4px;width:12px;height:12px;border-radius:50%;border:2px solid #0b0e13}
.slot.ev{box-shadow:0 0 10px var(--rc,#ffe9b0)}
.stat{font:600 12px var(--mono);color:var(--fg);background:#090b0fc8;border:1px solid #ffffff1c;padding:5px 10px;border-radius:14px;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em;font-variant-numeric:tabular-nums;align-self:flex-start}
.stat em{font-style:normal;color:var(--mute)}
.stat b{font-weight:700;margin-right:4px}
.stat b:last-of-type{margin-right:0}
#bbw{display:flex;flex-direction:column;align-items:center;gap:3px;padding-inline:16px}
#bbt{font:600 15px var(--display);letter-spacing:.18em;text-transform:uppercase;color:#ffd9de;text-shadow:0 2px 8px #000}
#bb{width:min(720px,100%);height:10px}
#bb i{background:linear-gradient(90deg,#ff9d2e,#ff4d5e)}
#say{align-self:center;margin:0 16px 8px;max-width:min(560px,calc(100% - 32px));background:#090b0fe6;border:1px solid #ffffff24;border-left:3px solid var(--acc);border-radius:5px;padding:7px 12px;font-size:13.5px;line-height:1.35;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px #0008;animation:drop .22s ease-out}
#say .st{color:var(--gold);font:700 12px var(--mono);white-space:nowrap}
/* рывок и ульта: кольцо показывает готовность */
#pad{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
.rb{--p:1;--c:var(--acc);position:relative;width:70px;height:70px;border-radius:50%;border:0;padding:0;background:conic-gradient(var(--c) calc(var(--p)*1turn),#ffffff1c 0);cursor:pointer;touch-action:none;color:var(--fg);font:600 11px var(--display);letter-spacing:.14em}
.rb::before{content:"";position:absolute;inset:3px;border-radius:50%;background:#0b0e13eb}
.rb span{position:relative;display:block;line-height:1.3}
.rb small{display:block;font:500 8px var(--mono);color:var(--mute);letter-spacing:.05em}
.rb.cd{color:var(--mute)}
#k3{--c:var(--gold);width:60px;height:60px;font-size:10px;color:var(--mute)}
#k3.rdy{color:var(--gold);box-shadow:0 0 18px #ffc93c88;animation:pulse 1.1s ease-in-out infinite}
/* ---------- карточки ---------- */
#ov{position:absolute;inset:0;background:#06080bd9;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#ov.clear{background:radial-gradient(ellipse at center,#06080b99,#06080be6)}
#ov.menu{background:linear-gradient(90deg,#06080be6 0%,#06080bb0 34%,#06080b00 62%);justify-content:flex-start;padding-left:clamp(16px,5vw,84px)}
#ov.menu .card{background:#0d1016e6;max-width:520px}
#ov.menu .card.wide{max-width:640px}
@media (max-aspect-ratio:19/20){#ov.menu{background:linear-gradient(0deg,#06080bf2 0%,#06080bb8 50%,#06080b00 74%);justify-content:center;align-items:flex-end;padding-left:16px}#ov.menu .card,#ov.menu .card.wide{max-width:560px;max-height:76%}}
@media (pointer:coarse){.kpc{display:none!important}}
@media (pointer:fine){.kph{display:none!important}}
.card{background:linear-gradient(180deg,#141922f5,#0d1016f5);border:1px solid var(--line);border-top-color:var(--line2);border-radius:10px;box-shadow:0 30px 90px #000c;padding:22px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;animation:rise .26s cubic-bezier(.2,.8,.2,1)}
.card.wide{max-width:800px}
.card p{margin:0;color:#cfd5de}
.card p.sm{font-size:13px;color:var(--mute)}
h1{font:700 clamp(34px,10vw,64px)/.95 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0;color:var(--fg);text-wrap:balance;text-align:center}
h1 span{color:var(--acc)}
h2{font:600 clamp(18px,5vw,24px)/1.15 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--fg);text-wrap:balance}
.eyebrow{font:600 11px var(--display);letter-spacing:.24em;text-transform:uppercase;color:var(--acc)}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.hero{display:flex;justify-content:center}
.dl{display:flex;gap:16px;align-items:flex-start}
.dl>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.keys{font:500 12px/1.75 var(--mono);color:var(--mute)}
.keys b{color:var(--fg);font-weight:700}
.acts{display:grid;gap:8px}
.acts.grid{grid-template-columns:repeat(3,minmax(0,1fr));counter-reset:k;gap:12px}
button.b{font:600 15px/1.2 var(--body);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--rc,var(--line2));border-radius:6px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;min-width:0;position:relative;transition:transform .12s,background .12s,box-shadow .15s,border-color .12s}
button.b>span{flex:1;min-width:0}
button.b small{display:block;font:500 12px/1.35 var(--body);color:var(--mute);margin-top:3px}
button.b small .up{display:block;color:var(--ok)}
button.b small .dn{display:block;color:var(--hot)}
button.b u{display:block;text-decoration:none;font:600 10px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--rc,var(--mute));margin-bottom:3px}
button.b em{font:700 12px var(--mono);font-style:normal;color:var(--gold);white-space:nowrap;display:flex;align-items:center;gap:4px}
button.b:hover:not(:disabled){background:#1f2531;border-color:var(--rc,var(--line2))}
button.b.pri{background:linear-gradient(180deg,#ffb04f,var(--acc));border-color:var(--acc);color:#16100a;box-shadow:0 6px 22px #ff9d2e44}
button.b.pri small{color:#3b2a14}
button.b.pri:hover:not(:disabled){background:linear-gradient(180deg,#ffc070,#ffab45)}
button.b.ctr{justify-content:center;text-align:center}
button.b.ctr>span{flex:0 1 auto}
button.b:disabled{opacity:.42;cursor:not-allowed}
button.b:active:not(:disabled){transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--xp);outline-offset:2px}
button{touch-action:manipulation}
button.b>span.icw,.icw{position:relative;flex:none;align-self:center}
.icw s{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;border:3px solid #141821}
/* карточки наград: цвет редкости светится сверху, легендарные и мифические переливаются */
.acts.grid button.b{counter-increment:k;flex-direction:column;align-items:stretch;gap:10px;padding:18px 14px 14px;border:1px solid color-mix(in srgb,var(--rc,#2a3141) 50%,#2a3141);border-radius:10px;background:radial-gradient(130% 62% at 50% 0%,color-mix(in srgb,var(--rc,#2a3141) 30%,transparent),transparent 72%),#141821;box-shadow:inset 0 2px 0 var(--rc,var(--line2));animation:rise .34s cubic-bezier(.2,.8,.2,1) backwards;overflow:hidden}
.acts.grid button.b:nth-child(2){animation-delay:.06s}
.acts.grid button.b:nth-child(3){animation-delay:.12s}
.acts.grid button.b:hover:not(:disabled){transform:translateY(-4px);background:radial-gradient(130% 62% at 50% 0%,color-mix(in srgb,var(--rc,#2a3141) 42%,transparent),transparent 72%),#181d28;box-shadow:inset 0 2px 0 var(--rc,var(--line2)),0 12px 34px color-mix(in srgb,var(--rc,#000) 32%,transparent)}
.acts.grid button.b img.ic,.acts.grid button.b .icw{align-self:center;filter:drop-shadow(0 8px 10px #000a)}
.acts.grid button.b em{margin-top:auto}
button.b.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 42%,#ffffff26 50%,transparent 58%);background-size:260% 100%;animation:sheen 2.6s linear infinite;pointer-events:none}
button.b.cu{background:repeating-linear-gradient(135deg,#171c0a 0 10px,#12160b 10px 20px)!important}
@media (pointer:fine){.acts.grid button.b::before{content:counter(k);position:absolute;top:8px;right:10px;font:700 10px var(--mono);color:var(--mute);border:1px solid var(--line2);border-radius:3px;padding:1px 5px}}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.pips i{width:6px;height:6px;background:#ffffff1f;border-radius:1px}
.pips i.on{background:var(--acc)}
.list{display:grid;gap:6px;font:500 13px var(--body);color:var(--mute)}
.list div{display:flex;gap:10px;align-items:center}
.list .tx{flex:1;min-width:0}
.list b{color:var(--fg)}
/* альбом */
.sec{display:flex;justify-content:space-between;align-items:baseline;font:600 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--fg);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:4px}
.sec span{font:500 11px var(--mono);color:var(--mute);letter-spacing:0}
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.cd{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;aspect-ratio:3/4;padding:6px 4px;border-radius:6px;border:1px solid var(--line2);background:linear-gradient(180deg,#1e2534,#11141b);color:var(--fg);font:500 10.5px/1.2 var(--body);text-align:center;min-width:0}
button.cd{cursor:pointer;transition:transform .12s,border-color .12s}
button.cd:hover{transform:translateY(-2px);border-color:var(--xp)}
.cd span{overflow-wrap:anywhere}
.cd img{width:72%;height:auto;flex:1;min-height:0;object-fit:contain}
.cd.lore{border-color:var(--gold);background:linear-gradient(180deg,#3d2e12,#15110a)}
.cd.no{color:#5a6478;border-style:dashed;background:none}
.cd.no em{flex:1;display:flex;align-items:center;font:700 26px var(--display);font-style:normal}
.cd i{position:absolute;top:4px;right:5px;font:700 10px var(--mono);font-style:normal;color:var(--mute)}
.bigc{display:flex;gap:16px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:14px;background:linear-gradient(180deg,#1e2534,#11141b)}
.bigc.lore{border-color:var(--gold);background:radial-gradient(120% 90% at 0% 0%,#ffc93c2e,transparent 60%),linear-gradient(180deg,#2c2210,#15110a);box-shadow:0 0 30px #ffc93c22}
.bigc>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.nk{display:flex;gap:8px}
.nk input{flex:1;min-width:0;font:600 15px var(--body);color:var(--fg);background:#0b0e13;border:1px solid var(--line2);border-radius:6px;padding:10px 12px}
.nk input:focus{outline:2px solid var(--xp);outline-offset:1px}
.lb{display:grid;gap:4px}
.lr{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:5px;background:#171b24;border:1px solid var(--line);font-size:13.5px}
.lr.me{border-color:var(--acc);background:#2a2014}
.lr i{font:700 12px var(--mono);font-style:normal;color:var(--mute)}
.lr b{overflow-wrap:anywhere}
.lr span{font:600 10px var(--display);letter-spacing:.12em;text-transform:uppercase;border:1px solid;border-radius:10px;padding:2px 8px;white-space:nowrap}
.lr b small{display:block;font:500 11px var(--body);color:var(--mute)}
.lr em{font:700 12px var(--mono);font-style:normal;color:var(--gold);white-space:nowrap}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
@keyframes sheen{from{background-position:120% 0}to{background-position:-140% 0}}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.card,.acts.grid button.b,#say,#k3.rdy,button.b.shine::after{animation:none}}
button.b.tile{padding:8px 10px;gap:8px;font-size:14px}
@media (max-width:640px){.acts.grid{grid-template-columns:1fr;gap:8px}.acts.grid button.b{flex-direction:row;align-items:center;padding:12px}.acts.grid button.b em{margin-top:0}.card{padding:16px}.bigc{flex-direction:column;text-align:center}#ho{font-size:22px}button.b.tile small{display:none}button.b.tile{flex-direction:column;gap:4px;padding:8px 4px;font-size:12px;text-align:center}.wide-only{display:none}.lr{grid-template-columns:20px minmax(0,1fr) auto auto;gap:6px;padding:7px 8px}h1{font-size:clamp(28px,8.4vw,40px)}}
</style>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="cv"></canvas>
  <div id="fd"></div>
  <div id="hud" hidden>
    <div id="xpb"><i id="bx"></i></div>
    <div id="h1">
      <div id="hl"><div id="hpo"><img id="hpi" alt=""><b id="lv"></b></div><div id="hpw"><div class="bar"><i id="bh"></i><span id="th"></span></div><span id="hz"></span></div></div>
      <div id="hc"><span id="ho"></span><small id="hs"></small></div>
      <div id="hr"><button id="pz" aria-label="Пауза"><i></i><i></i></button></div>
    </div>
    <div id="h2"><div id="hw"></div><div class="stat" id="hg"></div></div>
    <div id="bbw" hidden><span id="bbt"></span><div class="bar" id="bb"><i id="bbi"></i></div></div>
    <div id="say" hidden></div>
  </div>
  <div id="pad" hidden>
    <button class="rb" id="k3" aria-label="Ульта"><span>УЛЬТА<small class="kpc">E</small></span></button>
    <button class="rb" id="k2" aria-label="Рывок"><span>РЫВОК<small class="kpc">ПРОБЕЛ</small></span></button>
  </div>
  <div id="ov"></div>
</div>
<script>
addEventListener('error',e=>{const o=document.getElementById('ov');if(o&&!window.__err){window.__err=1;o.hidden=false;o.innerHTML='<div class="card"><div class="eyebrow">Ошибка</div><h2>Игра споткнулась</h2><p>Скопируй этот текст и пришли в чат, я починю:</p><p class="keys">'+String(e.message||e.error||'').replace(/</g,'&lt;').slice(0,900)+'</p></div>'}});
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],cl=(v,a,b)=>v<a?a:v>b?b:v,TAU=Math.PI*2,DEG=Math.PI/180,hyp=Math.hypot,lerp=(a,b,k)=>a+(b-a)*k;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function hex(c){if(c[0]!='#'){const m=c.match(/[\d.]+/g);return[+m[0],+m[1],+m[2]]}c=c.slice(1);if(c.length==3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];const n=parseInt(c,16);return[n>>16,n>>8&255,n&255]}
function tone(c,k){const[r,g,b]=hex(c);return k>=0?`rgb(${r+(255-r)*k|0},${g+(255-g)*k|0},${b+(255-b)*k|0})`:`rgb(${r*(1+k)|0},${g*(1+k)|0},${b*(1+k)|0})`}
function al(c,a){const[r,g,b]=hex(c);return`rgba(${r|0},${g|0},${b|0},${a})`}
const u01=c=>hex(c).map(v=>v/255);
function rng(s){return()=>{s=(s*1664525+1013904223)|0;return(s>>>0)/4294967296}}
function angLerp(a,b,k){let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return a+d*k}
function h3(x,y,z){const n=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return n-Math.floor(n)}
function vn3(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf),L=(a,b,t)=>a+(b-a)*t;
 return L(L(L(h3(xi,yi,zi),h3(xi+1,yi,zi),u),L(h3(xi,yi+1,zi),h3(xi+1,yi+1,zi),u),v),L(L(h3(xi,yi,zi+1),h3(xi+1,yi,zi+1),u),L(h3(xi,yi+1,zi+1),h3(xi+1,yi+1,zi+1),u),v),w)}

function cnv(S){const c=document.createElement('canvas');c.width=c.height=S;return c}
function tnoise(px,py,seed){const q=rng(seed*7919+13),g=new Float32Array(px*py);for(let i=0;i<g.length;i++)g[i]=q();
 return(x,y)=>{x-=Math.floor(x/px)*px;y-=Math.floor(y/py)*py;const xi=x|0,yi=y|0,xf=x-xi,yf=y-yi,x1=(xi+1)%px,y1=(yi+1)%py,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return(g[yi*px+xi]*(1-u)+g[yi*px+x1]*u)*(1-v)+(g[y1*px+xi]*(1-u)+g[y1*px+x1]*u)*v}}
function field(S,px,py,seed,oct){const o=new Float32Array(S*S);let amp=1,tot=0;for(let k=0;k<oct;k++){const n=tnoise(px,py,seed+k*17),kx=px/S,ky=py/S;for(let y=0,i=0;y<S;y++)for(let x=0;x<S;x++,i++)o[i]+=n(x*kx,y*ky)*amp;tot+=amp;amp*=.5;px*=2;py*=2}for(let i=0;i<o.length;i++)o[i]/=tot;return o}
const sst=(a,b,x)=>{const t=cl((x-a)/(b-a),0,1);return t*t*(3-2*t)};

function pauseCard(){if(paused||!P||G.ph=='menu'||G.dead>0)return;const u=CH[P.ch].u;card(`<div class="eyebrow">Пауза · ${G.end?'волна '+G.w:'глава '+(G.z+1)} · сложность: ${DF().n.toLowerCase()}</div><h2>${CH[P.ch].n}: начинка</h2><div class="list">${P.ws.map(w=>{const S=w.m&&SP[w.m];return`<div>${ic(WD[w.id].ic,30)}<span class="tx"><b>${WD[w.id].n}</b> ур. ${w.l}${w.l>=6?' · эволюция':''} · <span style="color:${RAR[w.q||0].c}">${RAR[w.q||0].n.toLowerCase()}</span>${S?`<br><span style="color:${S.c}">${S.n}</span>: ${S.up}, но ${S.dn}`:''}</span></div>`}).join('')}
 <div>${ic('star',24)}<span class="tx"><b>Ульта «${u[0]}»</b> · заряд ${Math.round(100*P.ul/ULN)}%<br>${u[1]}</span></div>
 ${Object.keys(P.ps).map(id=>`<div>${ic('p_'+id,24)}<span class="tx">${PS[id].n} · +${fmt(PS[id].per*P.ps[id],PS[id].d)}${PS[id].u}</span></div>`).join('')}${P.cur?`<div style="color:${CURSE}">${ic('skull',24)}Проклятий: ${P.cur} · −${Math.round((1-Math.pow(CURHP,P.cur))*100)}% к запасу здоровья</div>`:''}</div>`,
 [{t:'Продолжить',cls:'ctr pri',f:closeOv},{t:'Настройки',cls:'ctr',f(){setCard(()=>{paused=false;pauseCard()})}},{t:'Сдаться и выйти в меню',cls:'ctr',f:deathCard}])}

 [{t:'Выпить',s:'две редкие награды, враги сильнее',ic:'cauldron',rc:'#8be04a',f(){G.curse=1;P.rew.push('gold','gold');closeOv();banner('Проклят','#8be04a')}},{t:'Пройти мимо',cls:'ctr',f:closeOv}])}
const coinChip=()=>`<div class="stat">${ic('coin',16)} ${P.gold}<em>·</em>HP ${Math.ceil(P.hp)}/${P.mhp}</div>`;

 card(`<div class="dl">${ic('vend',92)}<div><div class="eyebrow">Автомат</div><p>Гудит, мигает и принимает монеты. Иногда берёт плату здоровьем.</p>${coinChip()}</div></div>`,
 o.off.map(x=>obtn(x,()=>{P.gold-=x.price;take(x);sfx('buy');o.off=o.off.filter(y=>y!=x);again()})).concat([
 {t:'Банка бульона',s:'+35% здоровья',ic:'jar',price:20,dis:P.gold<20||P.hp>=P.mhp,f(){P.gold-=20;P.hp=Math.min(P.mhp,P.hp+P.mhp*.35);hudSig='';again()}},
 {t:'Сделка на крови',tag:'платишь здоровьем',rc:MYTH,s:'−35% текущего здоровья, взамен награда редкого качества',ic:'p_vamp',dis:P.hp<P.mhp*.4||o.blood,f(){P.hp=Math.max(1,P.hp*.65);o.blood=1;P.rew.push('gold');closeOv()}},
 {t:'Уйти',cls:'ctr',f:closeOv}]))}
function openShop(){G.shop=P.ws.length<5?newWeapons(2,0).map(x=>(x.price=wprice(x.r),x)):[];G.shopM=[];for(let i=0;i<8&&G.shopM.length<2;i++){const x=Object.assign(spice(),{price:30+G.z*8});if(!G.shopM.some(y=>y.id==x.id&&y.m==x.m))G.shopM.push(x)}shop()}
function shop(){const price=(k,b)=>Math.round(b*Math.pow(1.3,P.buys[k]||0)),up=P.ws.filter(w=>w.l<wcap(1)),pp=Object.keys(PS).filter(id=>(P.ps[id]||0)<PS[id].cap&&PS[id].fix==null),cc=price('cd',40);
 const I=[['heal','jar','Тарелка бульона','+50% здоровья',25,P.hp<P.mhp,()=>{P.hp=Math.min(P.mhp,P.hp+P.mhp*.5)}],['wl','knife','Заточка','случайное оружие +1 уровень',60,up.length,()=>{pick(up).l++}],
 ['rf','p_dmg','Перековка','случайному оружию +1 к качеству',110,P.ws.some(w=>(w.q||0)<QM),()=>{pick(P.ws.filter(w=>(w.q||0)<QM)).q++}],['ps','p_xp','Кулинарная книга','случайная пассивка редкого качества',55,pp.length,()=>{take({t:'p',id:pick(pp),r:2})}],['rr','p_lk','Кубики','+2 переброса наград',20,1,()=>{P.rr+=2}],
 ['wash','o_plate','Чистая тарелка','смыть все приправы с оружия',10,P.ws.some(w=>w.m),()=>{P.ws.forEach(w=>delete w.m)}],['rev','p_fr','Заморозка про запас','одно воскрешение',150,!P.rev,()=>{P.rev=1}]];
 card(`<div class="dl">${ic('h_khinkali',84)}<div><div class="eyebrow">Ларёк «У Хинкали»</div><p>«Бери, брат. Тебе нужнее».</p>${coinChip()}</div></div>`,
 G.shop.map(x=>obtn(x,()=>{P.gold-=x.price;take(x);sfx('buy');G.shop=G.shop.filter(y=>y!=x);shop()})).concat(G.shopM.map(x=>obtn(x,()=>{P.gold-=x.price;take(x);sfx('buy');G.shopM=G.shopM.filter(y=>y!=x);shop()})),
 I.map(i=>{const c=price(i[0],i[4]);return{t:i[2],s:i[3],ic:i[1],sz:40,price:c,dis:!i[5]||P.gold<c,f(){P.gold-=c;P.buys[i[0]]=(P.buys[i[0]]||0)+1;i[6]();sfx('buy');recalc();hudSig='';shop()}}}),
 [{t:'Пакетик с карточкой',s:'случайная карточка в альбом, одна из десяти лорная',ic:'card',sz:40,price:cc,dis:P.gold<cc,f(){P.gold-=cc;P.buys.cd=(P.buys.cd||0)+1;gotCard(null,shop)}},
 {t:G.end?'К волне '+(G.w+1):'В следующую главу',s:'привал вернёт часть здоровья',cls:'ctr pri',f(){if(G.end){G.w++;G.z=(G.z+1)%ZN.length}else G.z++;recalc();P.hp=Math.min(P.mhp,Math.max(P.hp+P.mhp*.3,P.mhp*.6));startZone()}}]))}
function deathCard(){const z=G.z,end=G.end,st=runOver(false);card(`<div class="hero">${ic('ghost',110)}</div><div class="eyebrow" style="text-align:center">Тебя съели</div><h2 style="text-align:center">${end&&G.newRec?'Новый рекорд: волна '+G.w:pick(['Недосолен','Не дожевали, но всё же','Смерть на диете, но не сегодня'])}</h2><div class="rule"></div>
 <div class="list"><div>${end?`Волна <b>${G.w}</b> · лучший результат <b>${META.rec?META.rec.w:G.w}</b>`:`Глава <b>${z+1}. ${ZN[z].n}</b>`} · сложность <b>${DF().n.toLowerCase()}</b></div><div>Уровень <b>${P.lvl}</b> · убито <b>${P.kills}</b> · время <b>${P.time/60|0}:${String(P.time%60|0).padStart(2,'0')}</b></div><div>${ic('star',20)} Получено звёзд: <b>${st}</b>. Потрать их на улучшения, героев и скины, они остаются навсегда.</div></div>`,
 [{t:'Ещё забег',cls:'ctr pri',f(){charCard(end)}},...(end?[{t:'Таблица рекордов',cls:'ctr',f(){boardCard()}}]:[]),{t:'Улучшения за звёзды',cls:'ctr',f:metaCard},{t:'В меню',cls:'ctr',f:title}])}
function finale(){const end=(n,t)=>()=>{const st=runOver(true);P.kills=0;card(`<div class="hero">${ic(heroIc(P.ch),120)}</div><div class="eyebrow" style="text-align:center">Концовка · ${n}</div><p>${t}</p><div class="list"><div>${ic('star',20)} Получено звёзд: <b>${st}</b>. Золотой скин этого героя теперь твой бесплатно.</div></div>`,[{t:'Бесконечные волны',s:'продолжить этим же героем и начинкой; враги сразу как в последней главе',cls:'pri',ic:'skull',f(){G.end=1;G.w=1;G.zo=5;G.z=0;startZone()}},{t:'Новая игра+',s:'враги вдвое злее, начинка остаётся',ic:'wchest',f(){G.ngp++;G.z=0;startZone()}},{t:'В меню',cls:'ctr',f:title}])};
 card(`<div class="dl">${ic('b_hand',100)}<div><div class="eyebrow">Финал</div><p>Рука разжимается. Повар наклоняется к столу: «Рецепт велит отпустить. Но Рецепт писал я. Чего ты сам хочешь, сорок первый?» Солонка молчит. Впервые.</p></div></div>`,[
 {t:'Уйти и забрать Солонку',ic:'salt',f:end('Сорок первый','Ты катишься к краю стола. Солонка катится рядом. «Куда?» — «Не знаю. В этом и смысл». Позади Повар рвёт Рецепт и впервые за жизнь заказывает пиццу.')},
 {t:'Лечь в тарелку самому',ic:'o_plate',f:end('Канон','Ты ложишься в сметану. Не потому что привели, а потому что решил. Солонка плачет солью. Повар ест молча и больше никогда не лепит сорок первого.')},
 {t:'Съесть Повара',ic:'p_vamp',f:end('Переворот','Ты открываешь рот, которого у тебя нет. Сначала Повар. Потом кухня. Потом подъезд. Где-то внутри тебя закипает кастрюля, и маленький человек в ней думает: «Не хочу».')}])}
/* --- ввод --- */
addEventListener('keydown',e=>{if(e.target&&e.target.tagName=='INPUT')return;key[e.code]=1;aWake();if(paused){const n={Enter:0,Digit1:0,Digit2:1,Digit3:2,Numpad1:0,Numpad2:1,Numpad3:2}[e.code];if(n!=null){const b=$('ob'+n);b&&!b.disabled&&b.click()}return}if(e.code=='Space'){e.preventDefault();dash()}if(e.code=='KeyE'||e.code=='KeyQ'||e.code=='ShiftLeft')ult();if(e.code=='Escape'||e.code=='KeyP')pauseCard()});
addEventListener('keyup',e=>key[e.code]=0);addEventListener('blur',()=>{for(const k in key)key[k]=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseCard()});
addEventListener('pointerdown',aWake,true);
cv.addEventListener('contextmenu',e=>e.preventDefault());

cv.addEventListener('pointermove',e=>{if(e.pointerId==joy.id){const dx=e.clientX-joy.ox,dy=e.clientY-joy.oy,d=hyp(dx,dy)||1,m=Math.min(d,50)/50;joy.dx=dx/d*m;joy.dy=dy/d*m}});
const pup=e=>{if(e.pointerId==joy.id){joy.id=null;joy.dx=joy.dy=0}};addEventListener('pointerup',pup);addEventListener('pointercancel',pup);
$('k2').addEventListener('pointerdown',e=>{e.preventDefault();dash()});$('k3').addEventListener('pointerdown',e=>{e.preventDefault();ult()});$('pz').onclick=pauseCard;
/* --- запуск и подстройка под железо --- */
const FR=[1/60,1/120,1/144,1/90,1/75,1/165,1/240,1/30];let last=0,fcnt=0,fsum=0,fbad=0;
function frame(t){let dt=(t-last)/1000||0;const raw=dt*1000;last=t;dt=Math.min(.033,dt);
 /* шаг времени прилипает к частоте экрана: дрожание таймера браузера не превращается в дрожание картинки */
 for(const r of FR)if(Math.abs(dt-r)<r*.1){dt=r;break}FDT=dt;
 const wq=WMQ.length;if(wq)warmTick(paused?6:1.5);
 if(!paused)update(dt);else if(G.ph=='menu')menuTick(dt);else T+=dt*.4;
 render();
 /* если кадры проседают, сначала снижается разрешение, и только потом, в авторежиме, качество */
 if(!paused&&!wq&&!document.hidden&&raw<250){fcnt++;fsum+=raw;if(raw>25)fbad++;if(fcnt>=90){if(fsum/fcnt>19.5||fbad>30){if(RS>.62){RS=Math.max(.6,RS-.15);resize()}else if(META.gfx<0&&QI>0)setQuality(QI-1)}fcnt=fsum=fbad=0}}
 requestAnimationFrame(frame)}
if(META.run&&!okRun(META.run))META.run=null;
cardsInit();for(const k in META.cards)if(!CB[k])delete META.cards[k];
P={ch:META.last,lvl:1,xp:0,gold:0,ws:[],ps:{},rr:0,rev:0,buys:{},kills:0,time:0,hp:100,ul:0,pity:0,x:WW/2,y:WH/2,vx:0,vy:0,r:17,rot:0,at:0,inv:0,dash:0,cd:0,pdi:0,shd:0,ub:0,ubs:0,rew:[],tr:[],dh:[],mv:1};recalc();PR=Zc.ob.map(n=>MD[n].r);
lbInit();QI=META.gfx>=0?META.gfx:(matchMedia('(pointer:coarse)').matches?1:2);Q=QL[QI];resize();G.ph='';title();warmAll();requestAnimationFrame(frame);
